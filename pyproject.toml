[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codepulse-local"
version = "0.1.0"
description = "A reproducible, visual, local benchmark for small language models acting as coding agents via Ollama."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [
    { name = "CodePulse Local Contributors" }
]
dependencies = [
    "streamlit>=1.40",
    "plotly>=5.24",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
codepulse = "runner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = "."
