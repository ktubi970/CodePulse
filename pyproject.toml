[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codepulse-local"
version = "0.1.0"
description = "A reproducible, visual, local benchmark for small language models acting as coding agents via Ollama."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Krikor Tchepidjian" }
]
keywords = ["benchmark", "llm", "slm", "ollama", "coding-agent", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "streamlit>=1.40",
    "plotly>=5.24",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/ktubi970/CodePulse"
Issues = "https://github.com/ktubi970/CodePulse/issues"

[project.scripts]
codepulse = "runner.cli:main"

[tool.setuptools]
packages = ["agent", "runner", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = "."

[tool.ruff]
target-version = "py312"
line-length = 120
# Task fixtures are intentionally buggy or incomplete code given to the models.
extend-exclude = ["tasks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
